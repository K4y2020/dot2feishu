name: Offline checks and container smoke test

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test-lock.txt
      - name: Install pinned test dependencies
        run: |
          python -m pip install -r requirements-test-lock.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Run offline tests
        run: python -m pytest -q
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build image without credentials
        run: docker compose build --pull
      - name: Verify unprivileged image and native CLI without network
        run: |
          docker run --rm --network none dot2feishu:local --help
          docker run --rm --network none --entrypoint /bin/sh dot2feishu:local -ec '
            test "$(id -u)" = 10001
            test "$(stat -c %a /data)" = 700
            test "$(stat -c %u /data)" = 10001
            test -f /usr/local/bin/lark-cli
            test ! -L /usr/local/bin/lark-cli
            test ! -w /usr/local/bin/lark-cli
            sha256sum --check /usr/local/share/dot2feishu/lark-cli.sha256
            /usr/local/bin/lark-cli --version
          '
